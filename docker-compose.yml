version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    env_file:
      - ./backend/.env  # Path to your backend .env file
    ports:
      - "8000:8000"  # Expose Django on port 8000
    volumes:
      - ./backend:/app  # Sync backend code for development
      - sqlite_data:/app/db  # Persist SQLite database
    environment:
      DJANGO_SETTINGS_MODULE: movie_recommendation_system.settings  # Django settings module
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: vite_frontend
    env_file:
      - ./frontend/.env.development  # Dynamically load based on NODE_ENV
    ports:
      - "5173:5173"  # Expose Vite development server
    volumes:
      - ./frontend:/app  # Sync frontend code for development
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev

volumes:
  sqlite_data:  # Volume for SQLite persistence
