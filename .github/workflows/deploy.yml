name: Deploy Movie Recommendation System

on:
  push:
    branches:
      - main  # Trigger deployment when code is pushed to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: SSH into the server and clean up the target directory (excluding specific files and folders)
      - name: Clean up server directory (preserve db.sqlite3 and media folder)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Create a backup of the current deployment (excluding environment files)
            mkdir -p .backup
            cp -r backend .backup/backend
            cp -r frontend .backup/frontend
            cp docker-compose.yml .backup/docker-compose.yml

            # Ensure the backend/media directory exists
            mkdir -p backend/media

            # Move files and folders to preserve to a temporary directory
            mkdir -p .temp
            if [ -f "backend/db.sqlite3" ]; then
              mv backend/db.sqlite3 .temp/db.sqlite3
            else
              echo "Warning: backend/db.sqlite3 does not exist. Skipping move."
            fi
            if [ -d "backend/media" ]; then
              mv backend/media .temp/media
            else
              echo "Warning: backend/media does not exist. Skipping move."
            fi

            # Delete all files and subdirectories except the .temp directory
            find . -mindepth 1 -maxdepth 1 ! -name '.temp' -exec rm -rf {} +

            # Ensure the backend directory exists
            mkdir -p backend

            # Move preserved files and folders back to their original locations
            if [ -f ".temp/db.sqlite3" ]; then
              mv .temp/db.sqlite3 backend/db.sqlite3
            else
              echo "Warning: .temp/db.sqlite3 does not exist. Skipping move."
            fi
            if [ -d ".temp/media" ]; then
              mv .temp/media backend/media
            else
              echo "Warning: .temp/media does not exist. Skipping move."
            fi

            # Clean up the temporary directory
            rm -rf .temp

      # Step 3: Copy files to the server using SCP with password authentication
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: "/var/www/python.sicsglobal.com/movie_recommendation_system/"
          strip_components: 1  # Remove the top-level directory when copying
          overwrite: true  # Allow overwriting existing files
          tar_tmp_path: /tmp  # Use a writable temporary directory
          tar_exec: "tar"  # Use tar without sudo

      # Step 4: Create environment files on the server
      - name: Create environment files
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Create backend .env file
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env

            # Create frontend .env.development file
            echo "${{ secrets.FRONTEND_ENV_DEVELOPMENT }}" > frontend/.env.development

            # Create frontend .env.production file
            echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > frontend/.env.production

      # Step 5: SSH into the server and deploy the application using docker-compose
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Stop and remove existing containers
            docker-compose down

            # Build and start new containers
            docker-compose up -d --build

      # Step 6: Verify deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Check if the backend container is running
            if ! docker ps --filter "name=movie_recommendation_system_backend" --format "{{.Status}}" | grep -q "Up"; then
              echo "Backend container is not running. Rolling back..."
              exit 1
            fi

            # Check if the frontend container is running
            if ! docker ps --filter "name=movie_recommendation_system_frontend" --format "{{.Status}}" | grep -q "Up"; then
              echo "Frontend container is not running. Rolling back..."
              exit 1
            fi

            echo "Deployment verified successfully."

      # Step 7: Rollback in case of failure
      - name: Rollback on failure
        if: failure()  # Run this step only if any previous step fails
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Stop and remove any partially deployed containers
            docker-compose down

            # Restore the backup (excluding environment files)
            cp -r .backup/backend backend
            cp -r .backup/frontend frontend
            cp .backup/docker-compose.yml docker-compose.yml

            # Start the previous working containers
            docker-compose up -d

            echo "Rollback completed successfully."