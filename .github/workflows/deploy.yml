name: Deploy Movie Recommendation System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Prepare server directory with proper permissions
      - name: Setup server directory permissions
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            sudo mkdir -p /var/www/python.sicsglobal.com/movie_recommendation_system
            sudo chown -R $USER:$USER /var/www/python.sicsglobal.com/movie_recommendation_system
            sudo chmod -R 755 /var/www/python.sicsglobal.com/movie_recommendation_system

      # Step 3: Clean up the target directory (preserving db.sqlite3 and media)
      - name: Clean up server directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/
            
            # Create backup directory
            mkdir -p .backup
            
            # Backup current deployment
            [ -d "backend" ] && cp -r backend .backup/backend || echo "No backend to backup"
            [ -d "frontend" ] && cp -r frontend .backup/frontend || echo "No frontend to backup"
            [ -f "docker-compose.yml" ] && cp docker-compose.yml .backup/docker-compose.yml || echo "No docker-compose.yml to backup"
            
            # Create temp directory for preserved files
            mkdir -p .temp
            
            # Move files to preserve
            [ -f "backend/db.sqlite3" ] && mv backend/db.sqlite3 .temp/db.sqlite3 || echo "No db.sqlite3 to preserve"
            [ -d "backend/media" ] && mv backend/media .temp/media || echo "No media to preserve"
            
            # Clean directory (preserve .temp and .backup)
            find . -mindepth 1 -maxdepth 1 ! -name '.temp' ! -name '.backup' -exec rm -rf {} +
            
            # Restore preserved files
            mkdir -p backend
            [ -f ".temp/db.sqlite3" ] && mv .temp/db.sqlite3 backend/db.sqlite3 || echo "No db.sqlite3 to restore"
            [ -d ".temp/media" ] && mv .temp/media backend/media || echo "No media to restore"
            
            # Cleanup
            rm -rf .temp
            
            # Ensure proper permissions
            chmod -R 755 .
            chown -R $USER:$USER .

      # Step 4: Copy files to the server
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: "/var/www/python.sicsglobal.com/movie_recommendation_system/"
          strip_components: 1
          overwrite: true
          tar_tmp_path: /tmp

      # Step 5: Create environment files
      - name: Create environment files
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/
            
            # Create backend .env
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env
            chmod 600 backend/.env
            
            # Create frontend environment files
            echo "${{ secrets.FRONTEND_ENV_DEVELOPMENT }}" > frontend/.env.development
            echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > frontend/.env.production
            chmod 600 frontend/.env.*

      # Step 6: Deploy with docker-compose
      - name: Deploy application
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/
            
            # Stop and remove existing containers
            docker compose down
            
            # Build and start new containers
            docker compose up -d --build
            
            # Ensure proper permissions for media files
            docker compose exec backend chmod -R 755 /app/media
            docker compose exec backend chown -R www-data:www-data /app/media

      # Step 7: Verify deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Check container status
            if ! docker ps --filter "name=movie_recommendation_system_backend" --format "{{.Status}}" | grep -q "Up"; then
              echo "::error::Backend container is not running"
              exit 1
            fi
            
            if ! docker ps --filter "name=movie_recommendation_system_frontend" --format "{{.Status}}" | grep -q "Up"; then
              echo "::error::Frontend container is not running"
              exit 1
            fi
            
            echo "Deployment verified successfully"

      # Step 8: Rollback on failure
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/
            
            echo "::warning::Deployment failed - attempting rollback"
            
            # Stop any partially deployed containers
            docker compose down
            
            # Restore from backup
            if [ -d ".backup" ]; then
              rm -rf backend frontend docker-compose.yml
              cp -r .backup/backend backend
              cp -r .backup/frontend frontend
              cp .backup/docker-compose.yml docker-compose.yml
              
              # Start previous working containers
              docker compose up -d
              echo "Rollback completed successfully"
            else
              echo "::error::No backup found to rollback to"
              exit 1
            fi