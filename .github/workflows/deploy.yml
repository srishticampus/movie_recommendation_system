name: Deploy Movie Recommendation System

on:
  push:
    branches:
      - main  # Trigger deployment when code is pushed to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Copy files to the server using SCP with password authentication
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: "/var/www/python.sicsglobal.com/movie_recommendation_system/"
          strip_components: 1  # Remove the top-level directory when copying

      # Step 3: SSH into the server and deploy the application using docker-compose
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Stop and remove existing containers
            docker-compose down

            # Build and start new containers
            docker-compose up -d --build