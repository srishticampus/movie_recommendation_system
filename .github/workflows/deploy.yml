name: Deploy Movie Recommendation System

on:
  push:
    branches:
      - main  # Trigger deployment when code is pushed to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: SSH into the server and clean up the target directory (excluding specific files and folders)
      - name: Clean up server directory (preserve .env, db.sqlite3, and media folder)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Create a backup of the current deployment
            mkdir -p .backup
            sudo cp -r backend .backup/backend
            sudo cp -r frontend .backup/frontend
            sudo cp docker-compose.yml .backup/docker-compose.yml

            # Move files and folders to preserve to a temporary directory
            mkdir -p .temp
            sudo mv backend/.env .temp/backend.env
            sudo mv backend/db.sqlite3 .temp/db.sqlite3
            sudo mv backend/media .temp/media
            sudo mv frontend/.env.development .temp/frontend.env.development
            sudo mv frontend/.env.production .temp/frontend.env.production

            # Delete all files and subdirectories except the .temp directory
            sudo find . -mindepth 1 -maxdepth 1 ! -name '.temp' -exec rm -rf {} +

            # Move preserved files and folders back to their original locations
            sudo mv .temp/backend.env backend/.env
            sudo mv .temp/db.sqlite3 backend/db.sqlite3
            sudo mv .temp/media backend/media
            sudo mv .temp/frontend.env.development frontend/.env.development
            sudo mv .temp/frontend.env.production frontend/.env.production

            # Clean up the temporary directory
            sudo rm -rf .temp

      # Step 3: Copy files to the server using SCP with password authentication
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: "/var/www/python.sicsglobal.com/movie_recommendation_system/"
          strip_components: 1  # Remove the top-level directory when copying
          overwrite: true  # Allow overwriting existing files
          tar_tmp_path: /tmp  # Use a writable temporary directory
          tar_exec: "sudo tar"  # Use sudo for the tar command

      # Step 4: SSH into the server and deploy the application using docker-compose
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Stop and remove existing containers
            sudo docker-compose down

            # Build and start new containers
            sudo docker-compose up -d --build

      # Step 5: Verify deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Check if the backend container is running
            if ! sudo docker ps --filter "name=movie_recommendation_system_backend" --format "{{.Status}}" | grep -q "Up"; then
              echo "Backend container is not running. Rolling back..."
              exit 1
            fi

            # Check if the frontend container is running
            if ! sudo docker ps --filter "name=movie_recommendation_system_frontend" --format "{{.Status}}" | grep -q "Up"; then
              echo "Frontend container is not running. Rolling back..."
              exit 1
            fi

            echo "Deployment verified successfully."

      # Step 6: Rollback in case of failure
      - name: Rollback on failure
        if: failure()  # Run this step only if any previous step fails
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/python.sicsglobal.com/movie_recommendation_system/

            # Stop and remove any partially deployed containers
            sudo docker-compose down

            # Restore the backup
            sudo cp -r .backup/backend backend
            sudo cp -r .backup/frontend frontend
            sudo cp .backup/docker-compose.yml docker-compose.yml

            # Start the previous working containers
            sudo docker-compose up -d

            echo "Rollback completed successfully."